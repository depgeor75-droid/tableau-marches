# ==========================================================================
# SOURCE UNIQUE DE VÉRITÉ : toutes les séries du tableau de bord (PLAN §4).
# Champs : voir PLAN §3. Résumé :
#   type T (taux, %) | N (niveau, prix) | N* (indice centré) ;
#   frequence J | S | M | T | A ; priorite E (essentielle) | S (secondaire) ;
#   source + code (+ options) ; facteur (multiplicateur d'unité) ;
#   avant   : préfixe historique d'une autre source, coupé à date fixe (jusqua) ;
#   rapide  : jours récents provisoires d'une source rapide (raccord contrôlé) ;
#   secours : source de secours, mode prolonge (même nature) ou remplace (nature différente) ;
#   transformation : aucune | glissement_annuel | ecart | croise | pourcentage_pib | produit | en_euros ;
#   entrees : séries utilisées par une transformation calculée ;
#   auxiliaire : série de calcul, jamais publiée ;
#   raison : texte affiché quand la série est non disponible.
# Famille K : ajoutez une ligne « - {id: K2, nom: Nom de l'action, code: CODE.YAHOO} ».
# ==========================================================================

defauts: {debut: "1990-01-01", decimales: 2, decimales_stockage: 4, priorite: S, transformation: aucune, mouvement: non}

familles:
  A: {nom: "Taux directeurs", page: taux, fichier: taux}
  B: {nom: "Taux longs et écarts", page: taux, fichier: taux}
  C: {nom: "Inflation", page: inflation, fichier: inflation}
  D: {nom: "Anticipations et signaux avancés", page: inflation, fichier: inflation}
  E: {nom: "Croissance et dette", page: croissance, fichier: croissance}
  F: {nom: "Banques centrales et masse monétaire", page: banques, fichier: banques}
  G: {nom: "Indices boursiers", page: bourses, fichier: bourses}
  H: {nom: "Énergie, matières premières et ETF", page: energie, fichier: energie}
  I: {nom: "Devises", page: devises, fichier: devises}
  J: {nom: "Risques, stress et géopolitique", page: risques, fichier: risques}
  K: {nom: "Valeurs suivies", page: bourses, fichier: bourses,
      defauts: {source: yahoo, type: N, priorite: S, frequence: J, fiche: K, decimales: 2, unite: "EUR", zone_horaire: EU, mouvement: oui}}

