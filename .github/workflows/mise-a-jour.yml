name: Mise à jour des données

on:
  schedule:
    - cron: "17 5 * * *"   # 5 h 17 UTC = 6 h 17 (hiver) ou 7 h 17 (été), heure belge
  workflow_dispatch:        # bouton « Run workflow » (mise à jour manuelle)
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Dépendances
        if: github.event_name != 'push'
        run: pip install -r scripts/requirements.txt

      - name: Collecte
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect.py --declencheur "${{ github.event_name }}"

      - name: Contrôle
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/collect.py --verifier

      - name: Aucune clé dans les fichiers produits
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/verifier_cle.py --dossiers data docs

      - name: Enregistrement des données
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement dans data/"
          else
            git commit -m "Mise à jour des données — $(TZ=Europe/Brussels date +%d/%m/%Y)"
            git pull --rebase -X theirs origin main   # en cas de conflit sur data/, les données du robot (plus récentes) l emportent
            git push origin HEAD:main
          fi

      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html robots.txt .nojekyll css js lib data _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v5

      - name: Alerte (séries essentielles en panne ou en retard)
        if: github.event_name != 'push'
        run: python scripts/collect.py --alerte
